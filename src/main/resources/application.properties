spring.application.name=localshop
server.port=8080

# --- H2 en archivo (los datos se quedan guardados en la carpeta ./data) ---
spring.datasource.url=jdbc:h2:file:./data/localshop
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# consola para ver la tabla: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# --- MySQL (si se quiere usar en vez de H2, comentar lo de arriba) ---
#spring.datasource.url=jdbc:mysql://localhost:3306/localshop?createDatabaseIfNotExist=true&serverTimezone=America/Chihuahua
#spring.datasource.username=root
#spring.datasource.password=tu_password
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# para que no cachee las plantillas mientras desarrollamos
spring.thymeleaf.cache=false